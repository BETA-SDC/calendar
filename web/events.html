<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BETA 单次添加活动</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="access.js" defer></script>
    <script src="events.js" defer></script>
  </head>
  <body class="events-page">
    <main>
      <header class="page-header">
        <div>
          <h1>单次添加活动</h1>
          <p class="subtitle">
            选择活动后下载 ICS，或复制订阅链接用于邮件和通知。
          </p>
        </div>
        <nav aria-label="日历功能">
          <a class="page-link" href="calendar.html">查看日历</a>
          <a class="page-link" href="index.html">返回日历订阅</a>
        </nav>
      </header>
      <form id="access-form" class="access-bar">
        <div id="access-fields" class="access-fields">
          <label for="access-password">访问密码</label>
          <input id="access-password" type="password" autocomplete="current-password"
            aria-describedby="access-message" required>
          <button type="submit">解锁</button>
        </div>
        <button id="access-lock" type="button" hidden>锁定</button>
        <p id="access-message" aria-live="polite"></p>
      </form>

      <div class="event-controls">
        <label>可见范围
          <select id="event-scope">
            <option value="all">全部可访问活动</option>
            <option value="public" selected>公开活动</option>
            <option value="internal">内部事件（需密码）</option>
          </select>
        </label>
        <label>事件状态
          <select id="event-planning-status">
            <option value="all">全部状态（需密码）</option>
            <option value="planned" selected>计划事件</option>
            <option value="tentative">待定事件（需密码）</option>
          </select>
        </label>
        <label>年份
          <select id="event-year"></select>
        </label>
        <label>月份
          <select id="event-month"></select>
        </label>
      </div>

      <p id="event-status" class="list-status" aria-live="polite">正在加载活动…</p>
      <div id="event-list" class="event-list"></div>
    </main>
  </body>
</html>
