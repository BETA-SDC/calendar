<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BETA 单次添加活动</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="events.js" defer></script>
  </head>
  <body class="events-page">
    <main>
      <header class="page-header">
        <div>
          <h1>单次添加活动</h1>
          <p class="subtitle">
            选择活动后下载 ICS，或复制订阅链接用于邮件和通知。
          </p>
        </div>
        <nav aria-label="日历功能">
          <a class="page-link" href="index.html">返回日历订阅</a>
        </nav>
      </header>

      <div class="event-controls">
        <label>分类
          <select id="event-scope">
            <option value="all">全部活动</option>
            <option value="public" selected>公开活动</option>
            <option value="internal">内部事件</option>
          </select>
        </label>
        <label>年份
          <select id="event-year"></select>
        </label>
        <label>月份
          <select id="event-month"></select>
        </label>
      </div>

      <p id="event-status" class="list-status" aria-live="polite">正在加载活动…</p>
      <div id="event-list" class="event-list"></div>
    </main>
  </body>
</html>
