<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BETA 日历</title>
  <link rel="icon" href="mark.png" type="image/png">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="workspace.css">
  <script src="vendor/luxon.js" defer></script>
  <script src="vendor/fullcalendar.js" defer></script>
  <script src="vendor/fullcalendar-locales.js" defer></script>
  <script src="vendor/fullcalendar-luxon.js" defer></script>
  <script src="vendor/lucide.js" defer></script>
  <script src="calendar-preferences.js" defer></script>
  <script src="calendar-account.js" defer></script>
  <script src="calendar.js" defer></script>
</head>
<body class="calendar-app">
  <header class="site-header">
    <a class="brand" href="calendar.html"><img src="mark.png" width="36" height="36" alt=""><span>BETA <span class="brand-name">日历</span></span></a>
    <nav aria-label="主要导航"><a href="index.html"><i data-lucide="radio"></i>订阅日历</a><a href="events.html">活动列表</a></nav>
    <div class="account"><a id="login" href="/login">登录</a><span id="account-name"></span><button id="logout" title="退出登录" aria-label="退出登录" hidden><i data-lucide="log-out"></i>退出</button></div>
  </header>
  <main>
    <nav class="calendar-local-nav" aria-label="日历功能"><a href="calendar.html" aria-current="page">日历</a><a href="index.html">订阅日历</a><a href="events.html">活动列表</a></nav>
    <div class="page-heading"><div><p class="eyebrow">BETA STUDENT DEVELOPMENT COMMITTEE</p><h1>成员日历</h1></div><div><button id="resume" hidden><i data-lucide="refresh-cw"></i>检查发布状态</button><button id="create" class="primary" hidden><i data-lucide="plus"></i>新增活动</button></div></div>
    <div class="workspace-layout">
    <aside class="calendar-sidebar" aria-label="日历分类和外观">
      <div class="sidebar-heading"><h2>我的日历</h2><button id="categories-all" class="icon" title="全选分类" aria-label="全选分类"><i data-lucide="list-checks"></i></button></div>
      <div id="category-list" class="category-list"></div>
      <div class="sidebar-settings">
        <label for="density">显示密度</label><select id="density"><option value="comfortable">舒展</option><option value="compact">紧凑</option></select>
        <label for="jump-date">跳转日期</label><input id="jump-date" type="date">
      </div>
      <div class="sidebar-footer"><i data-lucide="globe"></i>Asia/Shanghai</div>
    </aside>
    <section class="calendar-workspace" aria-label="日历">
      <div class="toolbar">
        <div class="navigation"><button id="today">今天</button><button id="prev" class="icon" title="上一期" aria-label="上一期"><i data-lucide="chevron-left"></i></button><button id="next" class="icon" title="下一期" aria-label="下一期"><i data-lucide="chevron-right"></i></button><h2 id="period-title"></h2></div>
        <div id="views" class="segments" role="group" aria-label="日历视图">
          <button data-view="dayGridDay" aria-pressed="false">日</button><button data-view="dayGridWeek" aria-pressed="false">周</button><button data-view="dayGridMonth" aria-pressed="true">月</button><button data-view="quarter" aria-pressed="false">季</button><button data-view="multiMonthYear" aria-pressed="false">年</button>
        </div>
      </div>
      <div class="filters">
        <label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="搜索活动、地点" aria-label="搜索活动、地点"></label>
        <span id="filter-summary"></span>
        <span class="timezone">北京时间 · UTC+8</span>
      </div>
      <form id="access-form" class="access-bar" hidden>
        <label for="access-password">访问密码</label><input id="access-password" type="password" autocomplete="current-password" required><button>解锁</button>
      </form>
      <button id="access-lock" class="lock" hidden><i data-lucide="lock-keyhole"></i>锁定受限活动</button>
      <p id="status" role="status" aria-live="polite">正在加载日历…</p>
      <div class="workspace-body"><div class="calendar-scroll"><div id="calendar"></div></div>
        <aside class="agenda" aria-label="本期活动"><div class="agenda-heading"><h3>本期活动</h3><span id="event-count">0</span></div><div id="agenda"></div></aside>
      </div>
    </section>
    </div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="event-form">
      <header class="panel-header"><h2 id="editor-title">活动详情</h2><button type="button" id="editor-close" class="icon" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></header>
      <div id="detail"></div>
      <fieldset id="fields" hidden>
        <label>中文标题<input name="titleZh" required maxlength="250"></label>
        <label>English Title<input name="titleEn" required maxlength="250"></label>
        <div class="field-row"><label>范围<select name="scope"><option value="public">公开活动</option><option value="internal">内部事件</option></select></label><label>状态<select name="status"><option value="planned">计划事件</option><option value="tentative">待定事件</option></select></label></div>
        <label class="checkbox"><input type="checkbox" name="allDay">全天</label>
        <div class="field-row"><label>开始<input name="start" type="datetime-local" required></label><label>结束<input name="end" type="datetime-local" required><small id="end-note"></small></label></div>
        <label>中文地点<input name="locationZh" maxlength="250"></label>
        <label>English Location<input name="locationEn" maxlength="250"></label>
        <label>说明<textarea name="description" rows="4" maxlength="12000"></textarea></label>
        <label>来源链接<input name="sourceUrl" type="url" maxlength="2000"></label>
        <div class="field-row"><label>提醒<select name="alarmMode"><option value="keep">保留现有提醒</option><option value="set">设置提醒</option><option value="clear">无提醒</option></select></label><label id="alarm-value" hidden>提前分钟<input name="alarmMinutes" type="number" min="0" max="525600" value="10"></label></div>
      </fieldset>
      <p id="form-error" role="alert"></p>
      <footer class="panel-actions"><button type="button" id="delete" class="danger" hidden><i data-lucide="trash-2"></i>删除</button><button type="button" id="edit" hidden><i data-lucide="pencil"></i>编辑</button><button type="submit" id="save" class="primary" hidden><i data-lucide="check"></i>保存并发布</button></footer>
    </form>
  </dialog>
</body>
</html>
