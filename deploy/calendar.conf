[Service]
WorkingDirectory=/opt/betasdc-calendar
ExecStart=
ExecStart=/opt/betasdc-calendar/.venv/bin/gunicorn --chdir /opt/betasdc-calendar --pythonpath /opt/betasdc --bind unix:/run/betasdc/backend.sock --umask 7 --workers 2 --threads 2 --worker-class gthread --timeout 30 --graceful-timeout 10 --max-requests 1000 --max-requests-jitter 100 --limit-request-line 2048 --limit-request-fields 30 --limit-request-field_size 2048 --access-logfile /dev/null --error-logfile - calendar_service.beta_entry:create_app()
Environment=CALENDAR_STATE=/var/lib/betasdc-calendar
ReadWritePaths=/var/lib/betasdc-calendar
MemoryMax=384M
