# Included inside the existing http block; authentication stays on register.
server {
    listen 10.16.125.52:443 ssl;
    server_name calendar.betasdc.duckdns.org;
    ssl_certificate /etc/betasdc/wildcard/fullchain.pem;
    ssl_certificate_key /etc/betasdc/wildcard/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    if ($http_host != "calendar.betasdc.duckdns.org") { return 444; }
    allow 10.16.112.0/20;
    allow 10.17.0.0/18;
    allow 10.17.128.0/18;
    deny all;
    limit_conn connections 10;
    client_max_body_size 32k;
    # One-use login credentials must not enter proxy error logs.
    error_log /dev/null crit;
    location / {
        proxy_pass http://registration_backend;
        proxy_http_version 1.1;
        proxy_set_header Host calendar.betasdc.duckdns.org;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
